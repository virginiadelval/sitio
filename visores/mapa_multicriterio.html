    <style type="text/css">
    html,
    body {
        width: 100%;
        height: 95%;
        margin: 0;
    }

    /* El contenedor de los mapas ahora divide el espacio en dos columnas */
    #map,
    #container {
        width: 49.5%; /* Cada mapa ocupa casi la mitad del ancho */
        height: 100%;
        box-shadow: 5px 5px 5px #888;
        float: left; /* Usamos float para ponerlos uno al lado del otro */
    }
    
    #map {
        float: left; /* El primer mapa flota a la izquierda */
    }

    #container {
        float: right; /* El segundo mapa flota a la derecha */
    }

    /* Se elimina el estilo de los sub-contenedores, ya que el contenedor principal (#container) ahora contiene un solo mapa */
    #container .map {
        width: 100%;
        height: 100%; /* El mapa ocupa toda la altura del contenedor */
        background-color: #888;
    }


    .fullscreen-icon {
        background-image: url(css/images/icon-fullscreen.png);

    .titulo {

    h1 {

    /* Encabezado */
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 15px 30px;
			border-bottom: 1px solid #e0e0e0;
			background-color: #ffffff;
			position: relative;
			z-index: 10;
			/* Asegura que el encabezado esté sobre el mapa */
		}

		/* Logo */
		.logo {
			display: flex;
			align-items: center;
			font-size: 1.5rem;
			font-weight: bold;
			color: black;
			text-decoration: none;
		}

		.logo img {
			width: 24px;
			height: 24px;
			margin-right: 10px;
		}

		.logo span {
			color: #1e73e8;
			/* Color del icono */
		}

		/* Navegación */
		.nav-links {
			display: flex;
			gap: 20px;

		}

		.nav-links a {
			color: black;
			text-decoration: none;
			font-weight: 500;
			font-size: 0.9rem;
			position: relative;
		}

		.nav-links a:hover {
			color: #1e73e8;
		}

		/* Submenú para NOA */
		.dropdown {
			position: relative;
		}

		.dropdown-content {
			display: none;
			position: absolute;
			top: 100%;
			left: 0;
			background-color: #ffffff;
			box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
			z-index: 20;
			/* Asegura que el submenú esté sobre el mapa */
			padding: 10px 0;
			min-width: 160px;
		}

		.dropdown-content a {
			color: black;
			padding: 10px 20px;
			text-decoration: none;
			display: block;
		}

		.dropdown-content a:hover {
			background-color: #f1f1f1;
			color: #1e73e8;
		}

		/* Muestra el submenú al pasar el cursor */
		.dropdown:hover .dropdown-content {
			display: block;
		}


    </style>
